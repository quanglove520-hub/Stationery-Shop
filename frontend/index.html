<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stationery Shop - Đồ dùng văn phòng phẩm</title>
    <meta name="description" content="Khám phá và mua sắm đồ dùng học tập, văn phòng phẩm chất lượng cao với thiết kế hiện đại.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Thư viện Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="glass-header">
        <div class="logo">
            <span class="material-icons-outlined">edit</span>
            <h1>Stationery<span class="highlight">Glow</span></h1>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Tìm kiếm văn phòng phẩm...">
            <button id="searchBtn"><span class="material-icons-outlined">search</span></button>
        </div>
        <nav>
            <button class="nav-btn" onclick="openCart()">
                <span class="material-icons-outlined">shopping_cart</span> Giỏ Hàng <span id="cartBadge" class="badge">0</span>
            </button>
        </nav>
    </header>

    <main class="container">
        <div class="section-title">
            <h2>Khám phá mặt hàng</h2>
        </div>

        <div class="filter-bar-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <!-- Filter Category Tabs -->
            <div class="category-tabs" id="categoryTabs" style="margin-bottom: 0;">
                <button class="cat-tab active" data-id="all">Tất cả</button>
                <button class="cat-tab" data-id="Pen">Bút</button>
                <button class="cat-tab" data-id="Notebook">Sổ tay</button>
                <button class="cat-tab" data-id="Pencil">Bút chì</button>
                <button class="cat-tab" data-id="Bag">Balo</button>
                <button class="cat-tab" data-id="Eraser">Tẩy</button>
                <button class="cat-tab" data-id="Ruler">Thước</button>
                <button class="cat-tab" data-id="Organizer">Kệ/Bìa</button>
                <button class="cat-tab" data-id="Accessories">Phụ kiện</button>
            </div>

            <div class="filter-controls">
                <select id="sortSelect" class="sort-select">
                    <option value="">Sắp xếp mặc định</option>
                    <option value="price_asc">Giá: Thấp đến Cao</option>
                    <option value="price_desc">Giá: Cao đến Thấp</option>
                </select>
            </div>
        </div>
        
        <!-- Loading State -->
        <div id="loadingState" class="state-container">
            <div class="spinner"></div>
            <p>Đang tải dữ liệu từ máy chủ...</p>
        </div>

        <!-- Product Grid (Happy Path) -->
        <div id="productGrid" class="grid hidden">
            <!-- Sản phẩm sẽ được render dựa vào app.js -->
        </div>

        <!-- Empty State (Unhappy Path - No Data) -->
        <div id="emptyState" class="state-container hidden">
            <div class="empty-icon">
                <span class="material-icons-outlined">sentiment_dissatisfied</span>
            </div>
            <h3>NO DATA - Không có dữ liệu</h3>
            <p>Hiện không tìm thấy sản phẩm văn phòng phẩm nào phù hợp.</p>
        </div>
        
        <!-- Infinite Scroll Trigger -->
        <div id="infiniteScrollTrigger" class="state-container hidden">
            <div class="spinner"></div>
            <p>Đang tải thêm sản phẩm...</p>
        </div>
    </main>

    <!-- Product Detail Modal Popup -->
    <div id="productModal" class="modal-overlay hidden">
        <div class="modal-content glassmorphism">
            <button id="closeModal" class="close-btn"><span class="material-icons-outlined">close</span></button>
            <div class="modal-body" id="modalBody">
                <!-- Nội dung chi tiết render qua JS -->
            </div>
        </div>
    </div>

    <!-- Slide-over Cart Panel -->
    <div id="cartOverlay" class="cart-overlay hidden" onclick="closeCart()"></div>
    <div id="cartPanel" class="cart-panel glassmorphism hidden">
        <div class="cart-header">
            <h2>🛒 Giỏ Hàng Của Bạn</h2>
            <button class="close-btn" onclick="closeCart()"><span class="material-icons-outlined">close</span></button>
        </div>
        
        <div id="cartItems" class="cart-items">
            <!-- Render via JS -->
        </div>
        
        <div class="cart-footer">
            <div class="discount-section">
                <input type="text" id="discountCode" placeholder="Mã giảm giá (VD: SALE10)">
                <button onclick="applyDiscount()">Áp dụng</button>
            </div>
            <div class="total-row">
                <span>Tổng tiền:</span>
                <span id="cartTotal" class="total-price">0 đ</span>
            </div>
            <p id="discountMessage" class="discount-msg"></p>
            <button class="checkout-btn" onclick="checkout()"><span class="btn-text">💸 THANH TOÁN NGAY</span></button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
