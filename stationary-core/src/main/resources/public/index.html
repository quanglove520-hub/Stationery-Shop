<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stationery Shop - Đồ dùng văn phòng phẩm</title>
    <meta name="description" content="Khám phá và mua sắm đồ dùng học tập, văn phòng phẩm chất lượng cao với thiết kế hiện đại.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Thư viện Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="glass-header">
        <div class="logo">
            <span class="material-icons-outlined">edit</span>
            <h1>Stationery<span class="highlight">Glow</span></h1>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Tìm kiếm văn phòng phẩm...">
            <button id="searchBtn"><span class="material-icons-outlined">search</span></button>
        </div>
        
        <!-- Khu vực Wishlist của riêng bạn (đã dời ra khỏi <nav> để không đụng nhóm) -->
        <div style="position: relative; margin-left: 20px; margin-right: auto;">
            <button class="nav-btn" onclick="toggleWishlistPanel()">
                <span class="material-icons-outlined">favorite</span> Yêu thích <span id="wishlistBadge" class="badge">0</span>
            </button>
            
            <!-- Dropdown Yêu Thích -->
            <div id="wishlistDropdown" class="wishlist-dropdown hidden glassmorphism" style="right: auto; left: 0;">
                <div class="dropdown-header">
                    <h4>Sản phẩm yêu thích</h4>
                </div>
                <div id="wishlistItems" class="dropdown-items">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </div>

        <!-- Khu vực dành sẵn cho nhóm (Giỏ hàng, Đăng nhập) sau này -->
        <nav id="teamAreaPlaceholder" style="display:flex; gap:1rem;">
            <!-- Khi nhóm trưởng merge code, nút Giỏ hàng sẽ vào đây, không cấn Wishlist -->
        </nav>
    </header>

    <main class="container">
        <div class="section-title">
            <h2>Khám phá mặt hàng</h2>
        </div>

        <div class="filter-bar-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <!-- Filter Category Tabs -->
            <div class="category-tabs" id="categoryTabs" style="margin-bottom: 0;">
                <button class="cat-tab active" data-id="all">Tất cả</button>
                <button class="cat-tab" data-id="Pen">Bút</button>
                <button class="cat-tab" data-id="Notebook">Sổ tay</button>
                <button class="cat-tab" data-id="Pencil">Bút chì</button>
                <button class="cat-tab" data-id="Bag">Balo</button>
                <button class="cat-tab" data-id="Eraser">Tẩy</button>
                <button class="cat-tab" data-id="Ruler">Thước</button>
                <button class="cat-tab" data-id="Organizer">Kệ/Bìa</button>
                <button class="cat-tab" data-id="Accessories">Phụ kiện</button>
            </div>

            <div class="filter-controls">
                <select id="sortSelect" class="sort-select">
                    <option value="">Sắp xếp mặc định</option>
                    <option value="price_asc">Giá: Thấp đến Cao</option>
                    <option value="price_desc">Giá: Cao đến Thấp</option>
                </select>
            </div>
        </div>
        
        <!-- Loading State -->
        <div id="loadingState" class="state-container">
            <div class="spinner"></div>
            <p>Đang tải dữ liệu từ máy chủ...</p>
        </div>

        <!-- Product Grid (Happy Path) -->
        <div id="productGrid" class="grid hidden">
            <!-- Sản phẩm sẽ được render dựa vào app.js -->
        </div>

        <!-- Empty State (Unhappy Path - No Data) -->
        <div id="emptyState" class="state-container hidden">
            <div class="empty-icon">
                <span class="material-icons-outlined">sentiment_dissatisfied</span>
            </div>
            <h3>NO DATA - Không có dữ liệu</h3>
            <p>Hiện không tìm thấy sản phẩm văn phòng phẩm nào phù hợp.</p>
        </div>
        
        <!-- Infinite Scroll Trigger -->
        <div id="infiniteScrollTrigger" class="state-container hidden">
            <div class="spinner"></div>
            <p>Đang tải thêm sản phẩm...</p>
        </div>
    </main>

    <!-- Product Detail Modal Popup -->
    <div id="productModal" class="modal-overlay hidden">
        <div class="modal-content glassmorphism" style="position: relative;">
            <button id="closeModal" class="close-btn" style="position:absolute; top:15px; right:15px; background:rgba(255,255,255,0.1); border:none; color:white; border-radius:50%; width:36px; height:36px; cursor:pointer; z-index:9999; display:flex; justify-content:center; align-items:center; transition:0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">
                <span class="material-icons-outlined">close</span>
            </button>
            <div class="modal-body" id="modalBody" style="margin-top: 20px;">
                <!-- Nội dung chi tiết render qua JS -->
            </div>
        </div>
    </div>


    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
